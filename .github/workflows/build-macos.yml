        echo "=== Patch dylib references dynamically ==="
        for FILE in "$MACOS/darkplaces-sdl" \
                    "$FRAMEWORKS/libvorbisfile.3.dylib" \
                    "$FRAMEWORKS/libvorbis.0.dylib"; do

          echo "--- Patching $FILE ---"

          OLD_VORBIS="$(otool -L "$FILE" | awk '/libvorbis\.0/ {print $1}')"
          if [[ -n "$OLD_VORBIS" ]]; then
            install_name_tool -change "$OLD_VORBIS" "@executable_path/../Frameworks/libvorbis.0.dylib" "$FILE"
          fi

          OLD_VORBISFILE="$(otool -L "$FILE" | awk '/libvorbisfile\.3/ {print $1}')"
          if [[ -n "$OLD_VORBISFILE" ]]; then
