name: macOS Darkplaces Builds

# Runs only when started by hand: Actions tab -> macOS Darkplaces Builds -> Run workflow
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (tag + downloads) from this build"
        type: boolean
        default: false
      version:
        description: "Release version, e.g. 1.1 (leave empty for today's date, e.g. 2026.11.03)"
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15         # Apple Silicon (pinned; macos-latest queues badly)
          - arch: intel
            runner: macos-15-intel   # Intel

    runs-on: ${{ matrix.runner }}
    env:
      # Oldest macOS the app supports; keep in sync with LSMinimumSystemVersion
      # in Darkplaces.app/Contents/Info.plist and with the runner images above
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    name: Darkplaces (${{ matrix.arch }})

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install Homebrew dependencies
      run: |
        brew update
        brew install sdl2 libpng jpeg zlib pkg-config libogg libvorbis dylibbundler

    - name: Build Darkplaces
      run: |
        HOMEBREW_PREFIX="$(brew --prefix)"
        export CPPFLAGS="-I$HOMEBREW_PREFIX/opt/jpeg/include -I$HOMEBREW_PREFIX/opt/zlib/include"
        export LDFLAGS="-L$HOMEBREW_PREFIX/opt/jpeg/lib -L$HOMEBREW_PREFIX/opt/zlib/lib"
        export PKG_CONFIG_PATH="$HOMEBREW_PREFIX/opt/jpeg/lib/pkgconfig:$HOMEBREW_PREFIX/opt/zlib/lib/pkgconfig"
        make -j"$(sysctl -n hw.ncpu)" sdl-release

    - name: Bundle Darkplaces.app (SDL2 + Ogg/Vorbis included)
      run: bash scripts/bundle-macos.sh

    - name: Check minimum macOS version of all binaries
      run: |
        otool -l Darkplaces.app/Contents/MacOS/darkplaces-sdl Darkplaces.app/Contents/Frameworks/*.dylib \
          | awk '/minos/ {print $2}' | sort -uV | tee minos.txt
        if awk -v t="$MACOSX_DEPLOYMENT_TARGET" '{ split($1,a,"."); split(t,b,"."); if (a[1]+0 > b[1]+0) bad=1 } END { exit bad }' minos.txt; then
          echo "OK: nothing requires more than macOS $MACOSX_DEPLOYMENT_TARGET"
        else
          echo "ERROR: a bundled file requires a newer macOS than $MACOSX_DEPLOYMENT_TARGET"; exit 1
        fi

    - name: Sign, notarize and zip
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      run: |
        if [[ -n "$MACOS_CERTIFICATE" ]]; then
          bash scripts/sign-notarize-macos.sh "${{ matrix.arch }}"
        else
          # no secrets (e.g. pull requests from other forks): ad-hoc signed zip only
          echo "::warning::No signing secrets available - uploading an unsigned (ad-hoc) build"
          ditto -c -k --sequesterRsrc --keepParent Darkplaces.app "Darkplaces-${{ matrix.arch }}.zip"
        fi

    - name: Upload app bundle
      uses: actions/upload-artifact@v7
      with:
        name: Darkplaces-${{ matrix.arch }}
        path: Darkplaces-${{ matrix.arch }}.zip
        # upload our own ditto zip as-is: no extra GitHub zip around it
        # (Archive Utility chokes on GitHub's wrapper zip)
        archive: false


  # ------------------------------------------------------------------
  #  Release: only when started by hand with "Publish release" ticked.
  #  Runs after both builds succeeded, creates the tag and the release
  #  and attaches the signed and notarized zips.
  # ------------------------------------------------------------------
  release:
    needs: build
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the tag and the release

    steps:
    - name: Download the zips of both builds
      uses: actions/download-artifact@v8
      with:
        pattern: Darkplaces-*
        path: dist

    - name: Create tag and release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        tag="${VERSION:-$(date -u +%Y.%m.%d)}"
        if gh release view "$tag" > /dev/null 2>&1; then
          echo "ERROR: a release '$tag' already exists - run again with another version"
          exit 1
        fi

        mapfile -t zips < <(find dist -type f -name 'Darkplaces-*.zip' | sort)
        if [[ ${#zips[@]} -ne 2 ]]; then
          echo "ERROR: expected 2 zips, found ${#zips[@]}:"; printf '  %s\n' "${zips[@]}"
          exit 1
        fi

        cat > notes.md <<NOTES
        DarkPlaces for macOS, signed with Developer ID and notarized by Apple.

        | Download | For |
        |---|---|
        | \`Darkplaces-arm64.zip\` | Apple Silicon Macs (M1 and newer) |
        | \`Darkplaces-intel.zip\` | Intel Macs |

        - Requires macOS 15 (Sequoia) or newer
        - Self-contained: SDL2/SDL3 and Ogg/Vorbis (.ogg music) are bundled, nothing to install
        - Built from commit ${GITHUB_SHA:0:8}, including upstream DarkPlacesEngine/DarkPlaces up to this point
        NOTES

        # --target creates the tag on exactly the commit that was built
        gh release create "$tag" "${zips[@]}" \
          --target "$GITHUB_SHA" \
          --title "DarkPlaces for macOS $tag" \
          --notes-file notes.md
