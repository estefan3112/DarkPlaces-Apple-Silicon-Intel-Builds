name: macOS Intel Darkplaces Builds

on:
  push:
    branches:
      - master
  pull_request:

jobs:

  darkplaces-arm64:
    runs-on: macos-latest   # Apple Silicon

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install Homebrew dependencies (ARM64)
      run: |
        brew update
        brew install \
          sdl2 \
          libpng \
          jpeg \
          zlib \
          pkg-config \
          cmake \
          automake \
          autoconf

    - name: Build Darkplaces (ARM64)
      run: |
        export HOMEBREW_PREFIX="/opt/homebrew"
        export CPPFLAGS="-I$HOMEBREW_PREFIX/opt/jpeg/include -I$HOMEBREW_PREFIX/opt/zlib/include"
        export LDFLAGS="-L$HOMEBREW_PREFIX/opt/jpeg/lib -L$HOMEBREW_PREFIX/opt/zlib/lib"
        export PKG_CONFIG_PATH="$HOMEBREW_PREFIX/opt/jpeg/lib/pkgconfig:$HOMEBREW_PREFIX/opt/zlib/lib/pkgconfig"
        make -j$(sysctl -n hw.ncpu) sdl-release

    - name: Upload ARM64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: darkplaces-sdl-arm64
        path: ./darkplaces-sdl


  darkplaces-intel:
    runs-on: macos-15-intel   # new Intel runner

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install Homebrew dependencies (Intel)
      run: |
        brew update
        brew install \
          sdl2 \
          libpng \
          jpeg \
          zlib \
          pkg-config \
          cmake \
          automake \
          autoconf

    - name: Build Darkplaces (Intel)
      run: |
        export HOMEBREW_PREFIX="/usr/local"
        export CPPFLAGS="-I$HOMEBREW_PREFIX/opt/jpeg/include -I$HOMEBREW_PREFIX/opt/zlib/include"
        export LDFLAGS="-L$HOMEBREW_PREFIX/opt/jpeg/lib -L$HOMEBREW_PREFIX/opt/zlib/lib"
        export PKG_CONFIG_PATH="$HOMEBREW_PREFIX/opt/jpeg/lib/pkgconfig:$HOMEBREW_PREFIX/opt/zlib/lib/pkgconfig"
        make -j$(sysctl -n hw.ncpu) sdl-release

    - name: Upload Intel artifact
      uses: actions/upload-artifact@v4
      with:
        name: darkplaces-sdl-intel
        path: ./darkplaces-sdl
